<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELIMAR POS PRO</title>
    <style>
        /* --- DISEÑO PROFESIONAL "BLINDADO" (TODO INTERNO) --- */
        :root { --blue: #2563eb; --dark: #0f172a; --bg: #f3f4f6; --text: #1e293b; --white: #ffffff; --border: #e2e8f0; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

        /* SIDEBAR (Diseño del Video) */
        aside { width: 280px; background: var(--dark); flex-direction: column; padding: 25px; shrink-0; display: none; z-index: 1000; position: absolute; height: 100%; transition: 0.3s; }
        aside.open { display: flex; width: 100%; background: rgba(15, 23, 42, 0.95); }
        .logo-box { padding-bottom: 20px; border-bottom: 1px solid #1e293b; margin-bottom: 20px; color: white; }
        .user-pill { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .side-btn { width:100%; display:flex; align-items:center; gap:12px; padding:15px; border-radius:12px; color:#94a3b8; border:none; background:none; font-size:14px; font-weight:700; cursor:pointer; text-align:left; }
        .side-btn.active { background: #1e293b; color: white; border-left: 4px solid var(--blue); }

        /* CONTENEDOR PRINCIPAL */
        .app-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        header { height: 65px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; shrink-0; }
        .menu-toggle { background: none; border: none; font-size: 24px; cursor: pointer; }

        /* VISTA POS (IMAGEN 2) */
        main { flex: 1; padding: 15px; overflow-y: auto; padding-bottom: 150px; }
        .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .prod-card { background: white; border-radius: 20px; padding: 15px; border: 1px solid var(--border); text-align: center; position: relative; }
        .prod-img { aspect-ratio: 1; border-radius: 15px; background: #e0f2fe; color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 35px; font-weight: 900; margin-bottom: 10px; }
        .badge-cart { position: absolute; top: 10px; right: 10px; background: var(--blue); color: white; padding: 2px 8px; border-radius: 20px; font-size: 9px; font-weight: 800; }

        /* BARRA AZUL "VER TICKET" (IMAGEN 2) */
        .ticket-bar { position: fixed; bottom: 20px; left: 15px; right: 15px; background: var(--blue); color: white; border-radius: 20px; padding: 15px 20px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(37,99,235,0.4); z-index: 500; cursor: pointer; }
        .count-circle { width: 28px; height: 28px; background: white; color: var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; }

        /* MODALES */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; backdrop-filter: blur(5px); }
        .modal-body { background: white; width: 100%; max-width: 400px; border-radius: 30px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 14px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; font-weight: 700; margin-bottom: 15px; outline: none; }
        .btn-action { width: 100%; background: var(--blue); color: white; border: none; padding: 16px; border-radius: 15px; font-weight: 900; font-size: 14px; cursor: pointer; }

        /* TABLAS E INFORMES */
        .card { background: white; border-radius: 20px; border: 1px solid var(--border); padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .stat-card { background: white; border-radius: 25px; border: 1px solid var(--border); padding: 20px; text-align: center; margin-bottom: 15px; }

        @media (min-width: 1024px) { aside { display: flex; position: relative; width: 280px; } .menu-toggle { display: none; } .ticket-bar { width: 350px; left: auto; right: 30px; } }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside id="side-menu">
        <div class="logo-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="font-weight:900; font-size:20px;">ELIMAR</h2>
                <button onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:20px;" class="lg:hidden">✕</button>
            </div>
            <p style="font-size: 9px; font-weight: 700; opacity: 0.5;">INVENTARIOS PRO</p>
        </div>
        <div class="user-pill">
            <div style="width:40px; height:40px; background:#334155; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; color:white;">B</div>
            <div><p style="color:white; font-weight:800; font-size:13px;">BLOOD</p><p style="font-size:9px; color:#64748b; font-weight:700;">ADMINISTRADOR</p></div>
        </div>
        <button onclick="nav('pos')" id="p-pos" class="side-btn active">🛒 Punto de Venta</button>
        <button onclick="nav('inv')" id="p-inv" class="side-btn">📦 Inventario</button>
        <button onclick="nav('tkts')" id="p-tkts" class="side-btn">📜 Facturas</button>
        <button onclick="nav('reps')" id="p-reps" class="side-btn">📈 Informes</button>
        <button onclick="nav('conf')" id="p-conf" class="side-btn" style="margin-top:auto">⚙️ Ajustes</button>
    </aside>

    <div class="app-main">
        <header>
            <div style="display:flex; align-items:center; gap:15px;">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <h2 id="v-title" style="font-weight:900; font-size:18px;">Ventas</h2>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="background:#eff6ff; color:var(--blue); font-size:10px; font-weight:900; padding:6px 12px; border-radius:10px; border:1px solid #dbeafe;">COP ($)</div>
                <div style="width:35px; height:35px; border-radius:10px; background:#f1f5f9; display:flex; align-items:center; justify-content:center;">👤</div>
            </div>
        </header>

        <main id="v-content"></main>

        <div id="ticket-bar" class="ticket-bar" onclick="openCart()">
            <div style="display:flex; align-items:center; gap:12px;">
                <div id="badge-count" class="count-circle">0</div>
                <span style="font-weight:800; font-size:13px; text-transform:uppercase;">Ver Ticket</span>
            </div>
            <span id="badge-total" style="font-weight:900; font-size:20px;">$ 0</span>
        </div>
    </div>

    <div id="modal-bg" class="modal"><div id="modal-container" class="modal-body"></div></div>

<script>
    // --- LÓGICA COMPLETA ---
    const DB = {
        save: (k,v) => localStorage.setItem('pos_final_'+k, JSON.stringify(v)),
        get: (k,d) => JSON.parse(localStorage.getItem('pos_final_'+k)) || d,
        init() {
            if(!localStorage.getItem('pos_final_prods')) this.save('prods', []);
            if(!localStorage.getItem('pos_final_tkts')) this.save('tkts', []);
        }
    };
    DB.init();

    let cart = [];
    const fmt = (n) => `$ ${Math.round(n).toLocaleString()}`;

    function nav(v) {
        const c = document.getElementById('v-content');
        document.getElementById('v-title').innerText = v.toUpperCase();
        document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('p-'+v)?.classList.add('active');
        toggleMenu(false);

        if(v==='pos') renderPOS(c);
        if(v==='inv') renderInv(c);
        if(v==='tkts') renderTkts(c);
        if(v==='reps') renderReps(c);
        if(v==='conf') renderConf(c);
        updateCartUI();
    }

    function renderPOS(c) {
        const prods = DB.get('prods');
        c.innerHTML = `
            <input type="text" placeholder="🔍 Buscar prenda..." style="margin-bottom:20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div class="prod-grid">
                <div class="prod-card" style="border:2px dashed #cbd5e1; color:#94a3b8; display:flex; flex-direction:column; justify-content:center; align-items:center;" onclick="modalNewProd()">
                    <span style="font-size:40px; font-weight:300;">+</span><p style="font-size:10px; font-weight:800;">NUEVO</p>
                </div>
                ${prods.map(p => {
                    const count = cart.filter(x=>x.id==p.id).length;
                    return `<div class="prod-card" onclick="addToCart(${p.id})">
                        ${count>0 ? `<div class="badge-cart">${count} en carrito</div>` : ''}
                        <div class="prod-img">${p.n[0]}</div>
                        <p style="font-weight:700; font-size:12px; margin-bottom:4px;">${p.n}</p>
                        <p style="font-weight:900; color:var(--blue); font-size:14px;">${fmt(p.v)}</p>
                        <p style="font-size:9px; font-weight:800; color:#16a34a; margin-top:5px;">STOCK: ${p.s} UDS</p>
                    </div>`}).join('')}
            </div>`;
    }

    function addToCart(id) {
        const p = DB.get('prods').find(x=>x.id==id);
        if(p.s <= 0) return alert("Agotado");
        cart.push({...p});
        updateCartUI();
        renderPOS(document.getElementById('v-content'));
    }

    function updateCartUI() {
        const b = document.getElementById('ticket-bar');
        if(cart.length > 0) {
            b.style.display = 'flex';
            document.getElementById('badge-count').innerText = cart.length;
            document.getElementById('badge-total').innerText = fmt(cart.reduce((s,i)=>s+i.v,0));
        } else b.style.display = 'none';
    }

    function openCart() {
        const total = cart.reduce((s,i)=>s+i.v,0);
        showModal(`
            <h3 style="font-weight:900; margin-bottom:20px;">Mi Carrito</h3>
            <div style="max-height:250px; overflow-y:auto; margin-bottom:20px;">
                ${cart.map((i,idx)=>`<div style="display:flex; justify-content:space-between; font-weight:700; font-size:14px; margin-bottom:12px;"><span>${i.n}</span><span>${fmt(i.v)}</span></div>`).join('')}
            </div>
            <div style="display:flex; justify-content:space-between; font-weight:900; font-size:24px; border-top:1px dashed #ddd; padding-top:15px;"><span>TOTAL</span><span>${fmt(total)}</span></div>
            <button onclick="pagar(${total})" class="btn-action" style="margin-top:20px;">COBRAR AHORA</button>
            <button onclick="cart=[];closeM();nav('pos')" style="width:100%; border:none; background:none; color:red; font-weight:800; font-size:10px; margin-top:15px;">VACIAR TICKET</button>
        `);
    }

    function pagar(t) {
        const tkts = DB.get('tkts'); tkts.unshift({ id:Date.now(), f:new Date().toLocaleString(), t }); DB.save('tkts', tkts);
        const ps = DB.get('prods'); cart.forEach(c => { const pi=ps.findIndex(x=>x.id==c.id); if(pi!=-1) ps[pi].s-=1; }); DB.save('prods', ps);
        cart = []; closeM(); alert("¡Venta Exitosa!"); nav('tkts');
    }

    function renderInv(c) {
        c.innerHTML = `
            <button onclick="modalNewProd()" class="btn-action" style="background:var(--dark); margin-bottom:20px;">+ NUEVA PRENDA</button>
            ${DB.get('prods').map(p => `
                <div class="card" onclick="adjStock(${p.id})">
                    <div><p style="font-weight:800;">${p.n}</p><p style="font-size:9px; color:var(--gray);">STOCK DISPONIBLE</p></div>
                    <div style="text-align:right;"><p style="font-weight:900; color:var(--blue);">${fmt(p.v)}</p><p style="font-size:11px; font-weight:800;">${p.s} uds</p></div>
                </div>`).join('')}`;
    }

    function modalNewProd() {
        showModal(`
            <h3 style="font-weight:900; margin-bottom:20px;">Nueva Prenda</h3>
            <input type="text" id="n-n" placeholder="Nombre (Ej: Pijama Larga)">
            <input type="number" id="n-v" placeholder="Precio de Venta $">
            <input type="number" id="n-s" placeholder="Stock Inicial">
            <button onclick="saveP()" class="btn-action">GUARDAR PRENDA</button>
        `);
    }

    function saveP() {
        const n=document.getElementById('n-n').value, v=parseFloat(document.getElementById('n-v').value), s=parseInt(document.getElementById('n-s').value)||0;
        if(!n || isNaN(v)) return alert("Faltan datos");
        const ps = DB.get('prods'); ps.push({ id:Date.now(), n, v, s }); DB.save('prods', ps); closeM(); nav('inv');
    }

    function renderReps(c) {
        const total = DB.get('tkts').reduce((s,t)=>s+t.t,0);
        c.innerHTML = `<div class="stat-card"><p style="font-size:10px; font-weight:900; color:var(--gray); margin-bottom:5px;">VENTAS TOTALES BRUTAS</p><p style="font-size:35px; font-weight:900; color:var(--blue);">${fmt(total)}</p></div>`;
    }

    function renderTkts(c) { c.innerHTML = DB.get('tkts').map(t=>`<div class="card"><div><p style="font-weight:800;">Factura #${t.id.toString().slice(-4)}</p><p style="font-size:9px;">${t.f}</p></div><p style="font-weight:900;">${fmt(t.t)}</p></div>`).join(''); }
    function renderConf(c) { c.innerHTML = `<div class="stat-card"><button onclick="localStorage.clear(); location.reload();" style="color:red; font-weight:900; border:none; background:none;">BORRAR TODO Y REINICIAR APP</button></div>`; }

    function toggleMenu(show) { const m = document.getElementById('side-menu'); m.classList.toggle('open', show); }
    function showModal(h) { document.getElementById('modal-container').innerHTML = h; document.getElementById('modal-bg').style.display='flex'; }
    function closeM() { document.getElementById('modal-bg').style.display='none'; }

    window.onload = () => nav('pos');
</script>
</body>
</html>
