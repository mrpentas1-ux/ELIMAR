<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elimar POS - App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .sidebar-active { background: #2563eb; color: white; border-radius: 12px; }
        .mobile-active { color: #2563eb; border-top: 2px solid #2563eb; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col lg:flex-row overflow-hidden">
    <header class="h-16 bg-white border-b px-4 lg:px-8 flex items-center justify-between shrink-0 sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 w-10 h-10 rounded-lg flex items-center justify-center text-white font-bold">M</div>
            <h1 id="title" class="font-extrabold text-slate-800">Punto de Venta</h1>
        </div>
        <div class="text-right">
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Eliana Muñoz</p>
            <p class="text-[10px] text-green-500 font-bold uppercase tracking-tighter">● Conectado</p>
        </div>
    </header>

    <main id="content" class="flex-1 overflow-y-auto p-4 lg:p-8 pb-24">
        <!-- Contenido dinámico -->
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-2 shadow-2xl z-50">
        <button onclick="nav('ventas')" id="m-ventas" class="flex flex-col items-center p-2 mobile-active">
            <i data-lucide="shopping-cart" size="20"></i><span class="text-[9px] mt-1 font-bold uppercase">Ventas</span>
        </button>
        <button onclick="nav('inventario')" id="m-inventario" class="flex flex-col items-center p-2 text-slate-400">
            <i data-lucide="package" size="20"></i><span class="text-[9px] mt-1 font-bold uppercase">Stock</span>
        </button>
        <button onclick="nav('informes')" id="m-informes" class="flex flex-col items-center p-2 text-slate-400">
            <i data-lucide="bar-chart-3" size="20"></i><span class="text-[9px] mt-1 font-bold uppercase">Reporte</span>
        </button>
        <button onclick="nav('ajustes')" id="m-ajustes" class="flex flex-col items-center p-2 text-slate-400">
            <i data-lucide="settings" size="20"></i><span class="text-[9px] mt-1 font-bold uppercase">Ajustes</span>
        </button>
    </nav>

<script>
    const db = {
        prods: [
            { n: "Pijamma M", p: 35000, s: 1, c: "blue" },
            { n: "Blazer", p: 195000, s: 20, c: "orange" },
            { n: "Bolso Tote", p: 85000, s: 12, c: "amber" }
        ]
    };

    function nav(view) {
        const content = document.getElementById('content');
        const title = document.getElementById('title');
        
        document.querySelectorAll('button[id^="m-"]').forEach(btn => {
            btn.classList.remove('mobile-active');
            btn.classList.add('text-slate-400');
        });
        document.getElementById('m-'+view).classList.add('mobile-active');

        if(view === 'ventas') {
            title.innerText = "Punto de Venta";
            content.innerHTML = `<div class="grid grid-cols-2 gap-3">${db.prods.map(p => `<div class="bg-white p-4 rounded-3xl border shadow-sm active:scale-95 transition cursor-pointer"><div class="aspect-square bg-${p.c}-50 rounded-2xl mb-2 flex items-center justify-center text-2xl font-black text-${p.c}-300">${p.n[0]}</div><p class="font-bold text-xs text-slate-700">${p.n}</p><p class="text-blue-600 font-black text-sm mt-1">$${p.p.toLocaleString()}</p></div>`).join('')}</div>`;
        } else if(view === 'inventario') {
            title.innerText = "Inventario";
            content.innerHTML = `<div class="bg-white rounded-2xl border overflow-hidden">${db.prods.map(p => `<div class="p-4 flex justify-between items-center border-b last:border-0"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center font-bold text-slate-400">${p.n[0]}</div><div><p class="font-bold text-sm text-slate-800">${p.n}</p><p class="text-[10px] text-slate-400 uppercase font-bold">Stock: ${p.s} uds</p></div></div><p class="text-xs font-black text-blue-600">$${p.p.toLocaleString()}</p></div>`).join('')}</div>`;
        } else if(view === 'informes') {
            title.innerText = "Reportes";
            content.innerHTML = `<div class="space-y-3"><div class="bg-white p-6 rounded-3xl border shadow-sm"><p class="text-[10px] font-bold text-slate-400 uppercase">Ventas Brutas</p><p class="text-2xl font-black text-slate-800">$ 796.700</p></div><div class="bg-blue-600 p-6 rounded-3xl text-white shadow-xl shadow-blue-100"><p class="text-[10px] font-bold opacity-70 uppercase">Utilidad Estimada</p><p class="text-2xl font-black">$ 398.691</p></div></div>`;
        } else if(view === 'ajustes') {
            title.innerText = "Ajustes";
            content.innerHTML = `<div class="bg-white p-6 rounded-3xl border shadow-sm"><h4 class="text-[10px] font-bold text-blue-500 mb-4 uppercase tracking-widest"><i data-lucide="globe" size="12"></i> Moneda Principal</h4><div class="p-4 border-2 border-blue-500 bg-blue-50 rounded-2xl text-center"><p class="font-black text-xl">COP ($)</p><p class="text-[10px] font-bold text-blue-400 uppercase tracking-tighter">Peso Colombiano</p></div></div>`;
        }
        lucide.createIcons();
    }
    nav('ventas');
</script>
</body>
</html>
