<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elimar POS - Multimoneda Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .active-currency { border: 2px solid #2563eb; background-color: #eff6ff; }
        .sidebar-item-active { color: #2563eb; background: #f1f5f9; border-left: 4px solid #2563eb; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- HEADER ESTILO PROFESIONAL -->
    <header class="h-16 bg-white border-b px-4 flex items-center justify-between shrink-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center text-white font-black">E</div>
            <div>
                <h1 id="page-title" class="font-black text-sm uppercase tracking-tight">Ventas</h1>
                <p class="text-[9px] text-slate-400 font-bold uppercase">Mi Tienda - Elimar</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <div class="bg-slate-100 px-3 py-1 rounded-full text-[10px] font-bold text-slate-600" id="header-currency-code">COP ($)</div>
            <div class="text-right border-l pl-3 ml-2">
                <p class="text-[10px] font-black text-slate-500 uppercase leading-none">Eliana Muñoz</p>
                <span class="text-[9px] text-green-500 font-bold uppercase tracking-tighter italic">● Conectado</span>
            </div>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main id="main-view" class="flex-1 overflow-y-auto p-4 pb-32">
        <!-- Contenido via JS -->
    </main>

    <!-- MENU INFERIOR LOYVERSE -->
    <nav class="fixed bottom-0 w-full bg-[#0f172a] text-slate-400 flex justify-around p-2 border-t border-slate-800 z-50 shadow-2xl">
        <button onclick="changeView('ventas')" id="nav-ventas" class="flex flex-col items-center p-2"><i data-lucide="shopping-cart" size="18"></i><span class="text-[9px] mt-1 font-bold uppercase">Ventas</span></button>
        <button onclick="changeView('inventario')" id="nav-inventario" class="flex flex-col items-center p-2"><i data-lucide="package" size="18"></i><span class="text-[9px] mt-1 font-bold uppercase">Inventario</span></button>
        <button onclick="changeView('tickets')" id="nav-tickets" class="flex flex-col items-center p-2"><i data-lucide="ticket" size="18"></i><span class="text-[9px] mt-1 font-bold uppercase">Tickets</span></button>
        <button onclick="changeView('informes')" id="nav-informes" class="flex flex-col items-center p-2"><i data-lucide="bar-chart-3" size="18"></i><span class="text-[9px] mt-1 font-bold uppercase">Informes</span></button>
        <button onclick="changeView('ajustes')" id="nav-ajustes" class="flex flex-col items-center p-2"><i data-lucide="settings" size="18"></i><span class="text-[9px] mt-1 font-bold uppercase">Ajustes</span></button>
    </nav>

<script>
    // --- DATOS Y MONEDAS ---
    const currencies = [
        { code: 'COP', symbol: '$', name: 'Peso Colombiano' },
        { code: 'USD', symbol: '$', name: 'Dólar Estadounidense' },
        { code: 'EUR', symbol: '€', name: 'Euro (€)' },
        { code: 'MXN', symbol: '$', name: 'Peso Mexicano' },
        { code: 'PEN', symbol: 'S/', name: 'Sol Peruano' },
        { code: 'CLP', symbol: '$', name: 'Peso Chileno' },
        { code: 'ARS', symbol: '$', name: 'Peso Argentino' }
    ];

    // Inicializar DB
    if(!localStorage.getItem('elimar_prods')) {
        localStorage.setItem('elimar_prods', JSON.stringify([
            { id: 1, nombre: "Pijamma M", pVenta: 35000, pCosto: 25000, stock: 10, color: "blue" },
            { id: 2, nombre: "Blazer Estructurado", pVenta: 195000, pCosto: 95000, stock: 20, color: "orange" }
        ]));
    }
    if(!localStorage.getItem('elimar_currency')) localStorage.setItem('elimar_currency', JSON.stringify(currencies[0]));
    if(!localStorage.getItem('elimar_tickets')) localStorage.setItem('elimar_tickets', '[]');

    let carrito = [];
    const getCurrency = () => JSON.parse(localStorage.getItem('elimar_currency'));
    const getProds = () => JSON.parse(localStorage.getItem('elimar_prods'));
    const getTickets = () => JSON.parse(localStorage.getItem('elimar_tickets'));

    // Formateador de precio según moneda
    const fP = (num) => {
        const cur = getCurrency();
        return `${cur.symbol} ${Math.round(num).toLocaleString()}`;
    };

    function changeView(view) {
        const c = document.getElementById('main-view');
        const t = document.getElementById('page-title');
        const cur = getCurrency();
        
        document.getElementById('header-currency-code').innerText = `${cur.code} (${cur.symbol})`;
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('text-blue-500'));
        document.getElementById('nav-'+view).classList.add('text-blue-500');

        if(view === 'ventas') renderVentas(c, t);
        if(view === 'inventario') renderInventario(c, t);
        if(view === 'tickets') renderTickets(c, t);
        if(view === 'informes') renderInformes(c, t);
        if(view === 'ajustes') renderAjustes(c, t);
        lucide.createIcons();
    }

    function renderVentas(c, t) {
        t.innerText = "Punto de Venta";
        const totalCarrito = carrito.reduce((s, i) => s + i.pVenta, 0);
        c.innerHTML = `
            <div class="grid grid-cols-2 gap-3 mb-6">
                ${getProds().map(p => `
                    <div onclick="addCart(${p.id})" class="bg-white p-3 rounded-3xl border border-slate-100 shadow-sm active:scale-95 transition cursor-pointer">
                        <div class="aspect-square bg-${p.color}-50 rounded-2xl mb-2 flex items-center justify-center text-3xl font-black text-${p.color}-300">${p.nombre[0]}</div>
                        <h3 class="font-bold text-[11px] h-8 overflow-hidden">${p.nombre}</h3>
                        <p class="text-blue-600 font-black text-xs mt-1">${fP(p.pVenta)}</p>
                    </div>
                `).join('')}
            </div>
            <div class="bg-white rounded-3xl border shadow-xl p-5 border-t-4 border-t-blue-600">
                <p class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Carrito (${carrito.length})</p>
                <div class="flex justify-between items-center mb-4">
                    <span class="text-xl font-black">TOTAL</span>
                    <span class="text-xl font-black text-blue-600">${fP(totalCarrito * 1.19)}</span>
                </div>
                <button onclick="cobrar()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-100 active:bg-blue-700" ${carrito.length === 0 ? 'disabled opacity-50' : ''}>COBRAR</button>
            </div>
        `;
    }

    function addCart(id) {
        const p = getProds().find(x => x.id === id);
        carrito.push({...p});
        changeView('ventas');
    }

    function cobrar() {
        const total = carrito.reduce((s, i) => s + i.pVenta, 0) * 1.19;
        const tickets = getTickets();
        tickets.unshift({ id: Date.now(), fecha: new Date().toLocaleString(), total, items: [...carrito] });
        localStorage.setItem('elimar_tickets', JSON.stringify(tickets));
        carrito = [];
        alert("¡Venta Guardada con éxito!");
        changeView('ventas');
    }

    function renderInventario(c, t) {
        t.innerText = "Control de Inventario";
        c.innerHTML = `
            <div class="bg-white rounded-3xl border shadow-sm divide-y">
                ${getProds().map(p => `
                    <div class="p-4 flex justify-between items-center">
                        <div><p class="font-black text-sm text-slate-800">${p.nombre}</p><p class="text-[9px] font-bold text-slate-400">STOCK: ${p.stock} uds</p></div>
                        <p class="font-black text-blue-600 text-sm">${fP(p.pVenta)}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderTickets(c, t) {
        t.innerText = "Historial de Tickets";
        c.innerHTML = `
            <div class="space-y-3">
                ${getTickets().map(tk => `
                    <div class="bg-white p-5 rounded-3xl border shadow-sm flex justify-between items-center">
                        <div><p class="font-black text-sm uppercase">TKT-${tk.id.toString().slice(-4)}</p><p class="text-[10px] text-slate-400 font-bold">${tk.fecha}</p></div>
                        <p class="text-lg font-black text-slate-800">${fP(tk.total)}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function renderInformes(c, t) {
        t.innerText = "Ventas & Utilidades";
        const tickets = getTickets();
        const totalVendido = tickets.reduce((s, tk) => s + tk.total, 0);
        c.innerHTML = `
            <div class="space-y-4">
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm text-center">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Ventas Brutas</p>
                    <p class="text-4xl font-black text-slate-900">${fP(totalVendido)}</p>
                </div>
                <div class="bg-blue-600 p-6 rounded-[2rem] text-white text-center shadow-xl shadow-blue-100">
                    <p class="text-[10px] font-black opacity-60 uppercase tracking-widest mb-1">Utilidad Estimada</p>
                    <p class="text-4xl font-black">${fP(totalVendido * 0.5)}</p>
                </div>
            </div>
        `;
    }

    // --- SECCIÓN AJUSTES (COPIA DE TU FOTO 1) ---
    function renderAjustes(c, t) {
        t.innerText = "Ajustes de Tienda & Moneda";
        const activeCur = getCurrency();
        
        c.innerHTML = `
            <div class="bg-white rounded-3xl border shadow-sm p-6 mb-6">
                <h3 class="text-blue-500 font-black text-[10px] uppercase tracking-widest mb-6 flex items-center gap-2">
                    <i data-lucide="globe" size="14"></i> Moneda & Divisa del TPV
                </h3>
                <p class="text-[10px] text-slate-400 font-bold mb-4">Selecciona la moneda principal para mostrar los precios y tickets de compra:</p>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    ${currencies.map(cur => `
                        <div onclick="setCurrency('${cur.code}')" class="p-4 border-2 rounded-2xl text-center cursor-pointer transition-all ${activeCur.code === cur.code ? 'active-currency' : 'border-slate-100 hover:border-slate-200'}">
                            <p class="text-xl font-black">${cur.code}</p>
                            <p class="text-[14px] text-blue-600 font-bold">${cur.symbol}</p>
                            <p class="text-[9px] text-slate-400 font-bold uppercase mt-1 leading-none h-4">${cur.name}</p>
                        </div>
                    `).join('')}
                </div>

                <div class="mt-10 pt-8 border-t space-y-6">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Símbolo de Moneda</p>
                        <input type="text" value="${activeCur.symbol}" class="w-full bg-slate-50 border p-3 rounded-xl font-black text-slate-700" disabled>
                    </div>
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Código ISO</p>
                        <input type="text" value="${activeCur.code}" class="w-full bg-slate-50 border p-3 rounded-xl font-black text-slate-700" disabled>
                    </div>
                </div>
            </div>
            <button onclick="localStorage.clear(); location.reload();" class="w-full p-4 text-red-400 text-[10px] font-black uppercase tracking-widest">Reiniciar Sistema (Vaciar todo)</button>
        `;
    }

    function setCurrency(code) {
        const cur = currencies.find(c => c.code === code);
        localStorage.setItem('elimar_currency', JSON.stringify(cur));
        changeView('ajustes');
    }

    // Inicio
    changeView('ventas');
</script>
</body>
</html>
