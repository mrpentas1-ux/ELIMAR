<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elimar POS - Versión Profesional Blindada</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* --- DISEÑO PROFESIONAL EMBEBIDO (NO NECESITA INTERNET PARA VERSE BIEN) --- */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        :root { --blue: #2563eb; --dark: #0f172a; --bg: #f8fafc; --text: #1e293b; --gray: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* Estilos Sidebar y Navegación */
        aside { width: 280px; background: var(--dark); display: flex; flex-direction: column; padding: 30px 20px; shrink-0; }
        .logo-box { display: flex; align-items: center; gap: 12px; padding-bottom: 25px; border-bottom: 1px solid #1e293b; margin-bottom: 20px; }
        .logo-icon { background: var(--blue); width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 20px; box-shadow: 0 8px 15px rgba(37,99,235,0.3); }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 18px; color: var(--gray); border: none; background: transparent; cursor: pointer; text-align: left; font-size: 14px; font-weight: 700; border-radius: 12px; transition: 0.2s; }
        .nav-item.active { background: var(--blue); color: white; }
        
        .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
        header { height: 70px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; shrink-0; }
        .currency-badge { background: #eff6ff; color: var(--blue); font-size: 10px; font-weight: 900; padding: 6px 12px; border-radius: 10px; border: 1px solid #dbeafe; }
        main { flex: 1; padding: 25px; overflow-y: auto; }

        /* Estilos de los Módulos (Grid y Cards) */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 25px; border: 1px solid #f1f5f9; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .card:active { transform: scale(0.95); }
        .card-img { aspect-ratio: 1; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; margin-bottom: 12px; }
        .card-name { font-size: 12px; font-weight: bold; color: var(--text); height: 32px; overflow: hidden; }
        .card-price { font-size: 14px; font-weight: 800; color: var(--blue); margin-top: 5px; }

        /* Panel Carrito */
        .cart-panel { background: white; border-radius: 30px; border: 1px solid #e2e8f0; padding: 25px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); position: sticky; bottom: 0; }
        .btn-pay { width: 100%; background: var(--blue); color: white; border: none; padding: 18px; border-radius: 20px; font-weight: 800; font-size: 14px; margin-top: 20px; cursor: pointer; box-shadow: 0 10px 15px rgba(37,99,235,0.2); }
        .btn-pay:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Modales */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .modal-card { background: white; width: 100%; max-width: 450px; border-radius: 30px; padding: 30px; }
        input, select { width: 100%; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; font-weight: 700; margin-bottom: 15px; outline: none; }

        /* Ajustes de Moneda */
        .curr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .curr-btn { padding: 15px; border-radius: 18px; border: 2px solid #f1f5f9; background: white; font-weight: 800; cursor: pointer; text-align: center; }
        .curr-btn.active { border-color: var(--blue); background: #eff6ff; }

        /* Mobile Nav */
        .mobile-nav { display: none; position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #e2e8f0; padding: 10px 0 25px; justify-content: space-around; z-index: 100; }
        .m-nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; color: var(--gray); font-size: 9px; font-weight: 800; gap: 4px; }
        .m-nav-item.active { color: var(--blue); }

        @media (max-width: 1024px) {
            aside { display: none; }
            .mobile-nav { display: flex; }
            main { padding: 20px 20px 100px; }
            .grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <aside>
        <div class="logo-box">
            <div class="logo-icon">E</div>
            <div><p style="font-weight: 800; font-size: 14px;">ELIMAR</p><p style="font-size: 9px; color: var(--gray); font-weight: 700;">INVENTARIOS PRO</p></div>
        </div>
        <nav class="sidebar-nav">
            <button onclick="nav('pos')" id="pc-pos" class="nav-item active"><i data-lucide="shopping-cart"></i> Ventas</button>
            <button onclick="nav('inv')" id="pc-inv" class="nav-item"><i data-lucide="package"></i> Inventario</button>
            <button onclick="nav('tkts')" id="pc-tkts" class="nav-item"><i data-lucide="ticket"></i> Tickets</button>
            <button onclick="nav('reps')" id="pc-reps" class="nav-item"><i data-lucide="bar-chart-3"></i> Reportes</button>
            <button onclick="nav('conf')" id="pc-conf" class="nav-item" style="margin-top: auto;"><i data-lucide="settings"></i> Ajustes</button>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header>
            <h2 id="view-title" style="font-weight: 800; font-size: 18px;">Punto de Venta</h2>
            <div class="header-right" style="display: flex; gap: 10px; align-items: center;">
                <div class="currency-badge" id="h-curr-badge">...</div>
                <div style="width: 38px; height: 38px; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; justify-content: center;"><i data-lucide="user" size="18"></i></div>
            </div>
        </header>

        <main id="main-content"></main>

        <nav class="mobile-nav">
            <button onclick="nav('pos')" id="m-pos" class="m-nav-item active"><i data-lucide="shopping-cart"></i>VENTAS</button>
            <button onclick="nav('inv')" id="m-inv" class="m-nav-item"><i data-lucide="package"></i>STOCK</button>
            <button onclick="nav('reps')" id="m-reps" class="m-nav-item"><i data-lucide="bar-chart-3"></i>REPORTES</button>
            <button onclick="nav('conf')" id="m-conf" class="m-nav-item"><i data-lucide="settings"></i>AJUSTES</button>
        </nav>
    </div>

    <!-- MODALES -->
    <div id="modal-bg" class="modal-overlay">
        <div id="modal-container" class="modal-card"></div>
    </div>

<script>
    // --- MOTOR DE DATOS (AUTO-REPARACIÓN DE UNDEFINED) ---
    const DB = {
        save: (key, val) => localStorage.setItem('elimar_'+key, JSON.stringify(val)),
        get: (key, def) => JSON.parse(localStorage.getItem('elimar_'+key)) || def,
        init() {
            // Reparar datos corruptos
            const conf = this.get('config', {});
            if(!conf.currency || !conf.currency.sym) {
                this.save('config', { store: "ELIMAR", currency: {code:'COP', sym:'$'}, taxOn: true, taxRate: 19 });
            }
            if(!localStorage.getItem('elimar_cats')) this.save('cats', [{id: 1, n: 'General', c: '#3b82f6'}]);
            if(!localStorage.getItem('elimar_prods')) this.save('prods', []);
            if(!localStorage.getItem('elimar_tkts')) this.save('tkts', []);
        }
    };
    DB.init();

    let cart = [];
    const fmt = (n) => `${DB.get('config').currency.sym}${Math.round(n).toLocaleString()}`;

    function nav(view) {
        const c = document.getElementById('main-content');
        const t = document.getElementById('view-title');
        const conf = DB.get('config');

        document.getElementById('h-curr-badge').innerText = `${conf.currency.code} (${conf.currency.sym})`;
        document.querySelectorAll('.nav-item, .m-nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById('m-'+view)?.classList.add('active');
        document.getElementById('pc-'+view)?.classList.add('active');

        if(view === 'pos') renderPOS(c, t);
        if(view === 'inv') renderInv(c, t);
        if(view === 'tkts') renderTkts(c, t);
        if(view === 'reps') renderReps(c, t);
        if(view === 'conf') renderConf(c, t);
        lucide.createIcons();
    }

    // --- POS ---
    function renderPOS(c, t) {
        t.innerText = "Punto de Venta";
        const prods = DB.get('prods');
        const conf = DB.get('config');
        const sub = cart.reduce((s, i) => s + i.v, 0);
        const iva = conf.taxOn ? sub * (conf.taxRate/100) : 0;
        const total = sub + iva;

        c.innerHTML = `
            <div class="grid">
                ${prods.map(p => `
                    <div class="card" onclick="addCart(${p.id})">
                        <div class="card-img" style="background:${p.catColor}15; color:${p.catColor}">${p.n[0]}</div>
                        <p class="card-name">${p.n}</p>
                        <p class="card-price">${fmt(p.v)}</p>
                    </div>
                `).join('')}
            </div>
            <div class="cart-panel" style="margin-top: 30px;">
                <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:800; color:var(--gray); margin-bottom:5px;"><span>SUBTOTAL</span><span>${fmt(sub)}</span></div>
                ${conf.taxOn ? `<div style="display:flex; justify-content:space-between; font-size:10px; font-weight:800; color:var(--gray); margin-bottom:15px;"><span>IVA (${conf.taxRate}%)</span><span>${fmt(iva)}</span></div>` : ''}
                <div style="display:flex; justify-content:space-between; font-size:22px; font-weight:900;"><span>TOTAL</span><span>${fmt(total)}</span></div>
                <button class="btn-pay" onclick="pagar(${total})" ${cart.length===0?'disabled':''}>COBRAR</button>
            </div>
        `;
    }

    function addCart(id) {
        const p = DB.get('prods').find(x => x.id === id);
        if(p.s <= 0) return alert("Agotado");
        cart.push({...p});
        nav('pos');
    }

    function pagar(total) {
        const tkts = DB.get('tkts');
        tkts.unshift({ id: Date.now(), f: new Date().toLocaleString(), t: total, i: [...cart] });
        DB.save('tkts', tkts);

        const prods = DB.get('prods');
        cart.forEach(item => { const pi = prods.findIndex(x => x.id == item.id); if(pi!=-1) prods[pi].s -= 1; });
        DB.save('prods', prods);
        
        cart = [];
        alert("Venta exitosa");
        nav('pos');
    }

    // --- INVENTARIO ---
    function renderInv(c, t) {
        t.innerText = "Inventario";
        c.innerHTML = `
            <button onclick="modalProd()" style="width:100%; padding:15px; background:var(--blue); color:white; border-radius:15px; font-weight:900; border:none; margin-bottom:20px;">+ NUEVA PRENDA</button>
            <div style="background:white; border-radius:20px; border:1px solid #e2e8f0; overflow:hidden;">
                ${DB.get('prods').map(p => `
                    <div style="padding:15px; border-bottom:1px solid #f8fafc; display:flex; justify-content:space-between; align-items:center;">
                        <div><p style="font-weight:800; font-size:13px;">${p.n}</p><p style="font-size:9px; color:var(--gray);">STOCK: ${p.s} uds</p></div>
                        <p style="font-weight:900; color:var(--blue);">${fmt(p.v)}</p>
                    </div>
                `).join('')}
            </div>
        `;
    }

    // --- TICKETS ---
    function renderTkts(c, t) {
        t.innerText = "Tickets";
        c.innerHTML = DB.get('tkts').map(tk => `
            <div style="background:white; padding:15px; border-radius:20px; border:1px solid #e2e8f0; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                <div><p style="font-weight:800;">TKT-${tk.id.toString().slice(-4)}</p><p style="font-size:9px; color:var(--gray);">${tk.f}</p></div>
                <p style="font-weight:900; font-size:18px;">${fmt(tk.t)}</p>
            </div>
        `).join('');
    }

    // --- REPORTES ---
    function renderReps(c, t) {
        t.innerText = "Reportes";
        const tkts = DB.get('tkts');
        const gross = tkts.reduce((s, tk) => s + tk.t, 0);
        c.innerHTML = `
            <div style="background:white; padding:25px; border-radius:30px; border:1px solid #e2e8f0; text-align:center; margin-bottom:15px;">
                <p style="font-size:10px; font-weight:900; color:var(--gray); margin-bottom:5px;">VENTAS TOTALES BRUTAS</p>
                <p style="font-size:32px; font-weight:900;">${fmt(gross)}</p>
            </div>
        `;
    }

    // --- AJUSTES ---
    function renderConf(c, t) {
        t.innerText = "Ajustes";
        const conf = DB.get('config');
        const currs = [
            {code:'COP', sym:'$', name:'Peso Colombiano'},
            {code:'USD', sym:'$', name:'Dólar'},
            {code:'EUR', sym:'€', name:'Euro'},
            {code:'PEN', sym:'S/', name:'Sol'},
            {code:'MXN', sym:'$', name:'Peso Mexicano'}
        ];

        c.innerHTML = `
            <p style="font-size:10px; font-weight:900; color:var(--gray); margin-bottom:15px;">MONEDA PRINCIPAL</p>
            <div class="curr-grid">
                ${currs.map(cur => `
                    <div class="curr-btn ${conf.currency.code===cur.code?'active':''}" onclick="setCur('${cur.code}')">
                        <p>${cur.code}</p>
                        <p style="color:var(--blue);">${cur.sym}</p>
                        <p style="font-size:8px; color:var(--gray);">${cur.name}</p>
                    </div>
                `).join('')}
            </div>
            <div style="margin-top:30px;">
                <p style="font-size:10px; font-weight:900; color:var(--gray); margin-bottom:10px;">IMPUESTOS (IVA %)</p>
                <input type="number" id="tax-in" value="${conf.taxRate}" oninput="saveTax()">
            </div>
            <button onclick="localStorage.clear(); location.reload();" style="margin-top:40px; border:none; background:none; color:red; font-size:10px; font-weight:900; width:100%;">VACIAR BASE DE DATOS</button>
        `;
    }

    function setCur(code) {
        const currs = [{code:'COP', sym:'$'}, {code:'USD', sym:'$'}, {code:'EUR', sym:'€'}, {code:'PEN', sym:'S/'}, {code:'MXN', sym:'$'}];
        const conf = DB.get('config');
        conf.currency = currs.find(c => c.code === code);
        DB.save('config', conf);
        nav('conf');
    }

    function saveTax() {
        const conf = DB.get('config');
        conf.taxRate = document.getElementById('tax-in').value || 0;
        DB.save('config', conf);
    }

    // --- MODALES ---
    function modalProd() {
        document.getElementById('modal-bg').style.display = 'flex';
        document.getElementById('modal-container').innerHTML = `
            <h3 style="font-weight:900; margin-bottom:20px;">Nueva Prenda</h3>
            <input type="text" id="p-n" placeholder="Nombre">
            <input type="number" id="p-v" placeholder="Precio de Venta">
            <input type="number" id="p-s" placeholder="Stock">
            <button onclick="saveProd()" style="width:100%; padding:15px; background:var(--blue); color:white; border-radius:15px; font-weight:900; border:none;">GUARDAR</button>
        `;
    }

    function saveProd() {
        const n = document.getElementById('p-n').value;
        const v = parseFloat(document.getElementById('p-v').value);
        const s = parseInt(document.getElementById('p-s').value);
        if(!n || isNaN(v)) return;
        const prods = DB.get('prods');
        prods.push({ id: Date.now(), n, v, s, catColor: '#3b82f6' });
        DB.save('prods', prods);
        document.getElementById('modal-bg').style.display = 'none';
        nav('inv');
    }

    window.onload = () => nav('pos');
</script>
</body>
</html>
