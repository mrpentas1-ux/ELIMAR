<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elimar POS - Profesional</title>
    
    <!-- Librería de Iconos -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* --- DISEÑO PROFESIONAL "BLINDADO" (CSS INTERNO) --- */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --blue: #2563eb;
            --dark: #0f172a;
            --bg: #f8fafc;
            --text: #1e293b;
            --gray: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* BARRA LATERAL (PC) */
        aside {
            width: 280px;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            transition: all 0.3s;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 30px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 20px;
        }

        .logo-icon {
            background: var(--blue);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: var(--gray);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            text-align: left;
        }

        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--blue); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }

        /* HEADER */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; }
        header {
            height: 70px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .header-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .currency-badge {
            background: #eff6ff;
            color: var(--blue);
            font-size: 10px;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid #dbeafe;
        }

        /* CONTENIDO */
        main { flex: 1; padding: 30px; overflow-y: auto; }
        .content-card {
            background: white;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        /* MENÚ INFERIOR (MÓVIL) */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 10px 0 25px;
            justify-content: space-around;
            box-shadow: 0 -10px 15px -3px rgba(0,0,0,0.03);
        }

        .m-nav-item {
            background: none; border: none;
            display: flex; flex-direction: column; align-items: center;
            color: var(--gray); font-size: 9px; font-weight: 800; gap: 5px;
        }
        .m-nav-item.active { color: var(--blue); }

        /* ADAPTACIÓN MÓVIL */
        @media (max-width: 1024px) {
            aside { display: none; }
            .mobile-nav { display: flex; }
            main { padding: 20px; padding-bottom: 100px; }
            header { padding: 0 20px; }
        }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <aside>
        <div class="logo-box">
            <div class="logo-icon">E</div>
            <div>
                <p style="font-weight: 800; font-size: 14px; line-height: 1;">ELIMAR</p>
                <p style="font-size: 9px; color: var(--gray); font-weight: 700; margin-top: 4px;">INVENTARIOS PRO</p>
            </div>
        </div>
        <nav class="sidebar-nav">
            <button onclick="nav('pos')" id="pc-pos" class="nav-item active"><i data-lucide="shopping-cart"></i> Punto de Venta</button>
            <button onclick="nav('inv')" id="pc-inv" class="nav-item"><i data-lucide="package"></i> Inventario</button>
            <button onclick="nav('tkts')" id="pc-tkts" class="nav-item"><i data-lucide="ticket"></i> Tickets</button>
            <button onclick="nav('reps')" id="pc-reps" class="nav-item"><i data-lucide="bar-chart-3"></i> Reportes</button>
            <button onclick="nav('conf')" id="pc-conf" class="nav-item" style="margin-top: auto;"><i data-lucide="settings"></i> Ajustes</button>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header>
            <h2 id="view-title" class="header-title">Punto de Venta</h2>
            <div class="header-right">
                <div class="currency-badge">COP ($)</div>
                <div style="width: 35px; height: 35px; background: #f1f5f9; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                    <i data-lucide="user" size="18" style="color: #64748b;"></i>
                </div>
            </div>
        </header>

        <main id="main-content">
            <div class="content-card">
                <div style="width: 60px; height: 60px; background: #f8fafc; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                    <i data-lucide="layout" size="30" style="color: #cbd5e1;"></i>
                </div>
                <h3 style="font-weight: 800; font-size: 18px;">Bienvenido al Sistema</h3>
                <p style="color: var(--gray); font-size: 14px; margin-top: 8px;">Cargando módulos funcionales del Paso 2...</p>
            </div>
        </main>

        <!-- MENÚ MÓVIL -->
        <nav class="mobile-nav">
            <button onclick="nav('pos')" id="m-pos" class="m-nav-item active"><i data-lucide="shopping-cart"></i>POS</button>
            <button onclick="nav('inv')" id="m-inv" class="m-nav-item"><i data-lucide="package"></i>STOCK</button>
            <button onclick="nav('reps')" id="m-reps" class="m-nav-item"><i data-lucide="bar-chart-3"></i>REPORTES</button>
            <button onclick="nav('conf')" id="m-conf" class="m-nav-item"><i data-lucide="settings"></i>AJUSTES</button>
        </nav>
    </div>

    <script>
        function nav(view) {
            const container = document.getElementById('main-content');
            const title = document.getElementById('view-title');
            
            // Botones
            document.querySelectorAll('.nav-item, .m-nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('m-'+view)?.classList.add('active');
            document.getElementById('pc-'+view)?.classList.add('active');

            const labels = { pos: 'Punto de Venta', inv: 'Inventario', tkts: 'Tickets', reps: 'Reportes', conf: 'Ajustes' };
            title.innerText = labels[view];

            container.innerHTML = `
                <div class="content-card">
                    <h3 style="font-weight: 800;">Vista de ${labels[view]}</h3>
                    <p style="color: #94a3b8; font-size: 13px; margin-top: 10px;">Interfaz profesional lista. Procediendo al Paso 2...</p>
                </div>
            `;
            lucide.createIcons();
        }

        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
