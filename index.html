<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elimar POS - Profesional</title>
    
    <!-- Cargamos Tailwind para que se vea con el diseño del video -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        /* Estilo para los botones activos */
        .sidebar-active { background: #1e293b; color: #3b82f6; border-left: 4px solid #3b82f6; }
        .mobile-active { color: #2563eb; }

        /* Escondemos el scroll */
        ::-webkit-scrollbar { display: none; }

        /* Efecto de cristal para el header */
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(226, 232, 240, 1);
        }
    </style>
</head>
<body class="h-screen flex flex-col lg:flex-row overflow-hidden text-slate-800">

    <!-- 1. BARRA LATERAL (Solo para Computadora) -->
    <aside class="hidden lg:flex w-72 bg-[#0f172a] text-white flex-col shrink-0 shadow-2xl">
        <div class="p-8 border-b border-slate-800">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-black shadow-lg shadow-blue-500/20">E</div>
                <div>
                    <h1 class="font-black text-sm tracking-tight leading-none uppercase">Elimar</h1>
                    <p class="text-[9px] text-slate-500 font-bold uppercase mt-1 tracking-widest">Inventarios PRO</p>
                </div>
            </div>
        </div>
        
        <nav class="flex-1 py-6 space-y-1">
            <button onclick="nav('pos')" id="pc-pos" class="sidebar-active w-full flex items-center gap-4 px-8 py-4 text-white font-bold text-sm hover:bg-slate-800 transition-all">
                <i data-lucide="shopping-cart" size="20"></i> Punto de Venta
            </button>
            <button onclick="nav('inv')" id="pc-inv" class="w-full flex items-center gap-4 px-8 py-4 text-slate-400 font-bold text-sm hover:bg-slate-800 transition-all">
                <i data-lucide="package" size="20"></i> Inventario & Prendas
            </button>
            <button onclick="nav('tkts')" id="pc-tkts" class="w-full flex items-center gap-4 px-8 py-4 text-slate-400 font-bold text-sm hover:bg-slate-800 transition-all">
                <i data-lucide="ticket" size="20"></i> Historial Tickets
            </button>
            <button onclick="nav('clts')" id="pc-clts" class="w-full flex items-center gap-4 px-8 py-4 text-slate-400 font-bold text-sm hover:bg-slate-800 transition-all">
                <i data-lucide="users" size="20"></i> Clientes & Puntos
            </button>
            <button onclick="nav('reps')" id="pc-reps" class="w-full flex items-center gap-4 px-8 py-4 text-slate-400 font-bold text-sm hover:bg-slate-800 transition-all">
                <i data-lucide="bar-chart-3" size="20"></i> Informes & Ventas
            </button>
            <button onclick="nav('conf')" id="pc-conf" class="w-full flex items-center gap-4 px-8 py-4 text-slate-400 font-bold text-sm hover:bg-slate-800 transition-all mt-auto">
                <i data-lucide="settings" size="20"></i> Configuración
            </button>
        </nav>
    </aside>

    <!-- 2. BARRA INFERIOR (Solo para Celular) -->
    <nav class="lg:hidden fixed bottom-0 w-full bg-white border-t flex justify-around p-3 z-50 shadow-[0_-10px_25px_rgba(0,0,0,0.05)]">
        <button onclick="nav('pos')" id="m-pos" class="mobile-active flex flex-col items-center gap-1 transition-all">
            <i data-lucide="shopping-cart" size="20"></i><span class="text-[9px] font-extrabold uppercase tracking-widest">POS</span>
        </button>
        <button onclick="nav('inv')" id="m-inv" class="text-slate-400 flex flex-col items-center gap-1 transition-all">
            <i data-lucide="package" size="20"></i><span class="text-[9px] font-extrabold uppercase tracking-widest">Inventario</span>
        </button>
        <button onclick="nav('reps')" id="m-reps" class="text-slate-400 flex flex-col items-center gap-1 transition-all">
            <i data-lucide="bar-chart-3" size="20"></i><span class="text-[9px] font-extrabold uppercase tracking-widest">Informes</span>
        </button>
        <button onclick="nav('conf')" id="m-conf" class="text-slate-400 flex flex-col items-center gap-1 transition-all">
            <i data-lucide="settings" size="20"></i><span class="text-[9px] font-extrabold uppercase tracking-widest">Ajustes</span>
        </button>
    </nav>

    <!-- 3. ÁREA DE CONTENIDO -->
    <div class="flex-1 flex flex-col min-w-0 h-full">
        <!-- HEADER SUPERIOR -->
        <header class="h-20 glass-header px-6 lg:px-10 flex items-center justify-between shrink-0 sticky top-0 z-40">
            <h2 id="view-title" class="font-extrabold text-slate-800 text-xl tracking-tight">Punto de Venta</h2>
            
            <div class="flex items-center gap-4">
                <div class="bg-blue-50 border border-blue-100 px-4 py-2 rounded-2xl text-[10px] font-black text-blue-600 shadow-sm" id="header-curr">COP ($)</div>
                <div class="w-11 h-11 bg-slate-100 border border-slate-200 rounded-2xl flex items-center justify-center text-slate-600 shadow-sm">
                    <i data-lucide="user" size="20"></i>
                </div>
            </div>
        </header>

        <!-- CONTENEDOR DINÁMICO -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 lg:p-10 pb-24 lg:pb-10">
            <!-- Cargando contenido... -->
            <div class="h-full flex flex-col items-center justify-center opacity-20">
                <i data-lucide="loader-2" class="animate-spin mb-4" size="48"></i>
                <p class="font-bold uppercase tracking-[0.2em] text-xs">Cargando Sistema...</p>
            </div>
        </main>
    </div>

    <script>
        // Función para cambiar de pantalla
        function nav(view) {
            const container = document.getElementById('main-content');
            const title = document.getElementById('view-title');
            
            // 1. Estilos de navegación
            document.querySelectorAll('nav button, aside button').forEach(b => {
                b.classList.remove('sidebar-active', 'mobile-active', 'text-white', 'text-blue-600');
                b.classList.add('text-slate-400');
            });
            document.getElementById('m-'+view)?.classList.add('mobile-active');
            document.getElementById('pc-'+view)?.classList.add('sidebar-active', 'text-white');

            // 2. Títulos
            const labels = {
                pos: 'Punto de Venta',
                inv: 'Inventario & Prendas',
                tkts: 'Historial de Tickets',
                clts: 'Clientes & Puntos',
                reps: 'Informes & Ganancias',
                conf: 'Configuración del POS'
            };
            title.innerText = labels[view];

            // 3. Contenido Temporal (Professional Placeholder)
            container.innerHTML = `
                <div class="bg-white rounded-[2.5rem] border border-slate-200 p-12 text-center shadow-sm">
                    <div class="w-20 h-20 bg-slate-50 rounded-3xl flex items-center justify-center mx-auto mb-6 text-slate-200">
                        <i data-lucide="layout" size="40"></i>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 mb-2">Pantalla de ${labels[view]}</h3>
                    <p class="text-slate-400 text-sm max-w-xs mx-auto">Esta sección está lista para recibir los módulos funcionales en el siguiente paso.</p>
                </div>
            `;
            
            lucide.createIcons();
        }

        // Iniciar en POS al cargar
        window.onload = () => {
            lucide.createIcons();
            setTimeout(() => nav('pos'), 500);
        };
    </script>
</body>
</html>
